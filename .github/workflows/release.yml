name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  PYINSTALLER_SPEC: "pyinstaller>=6.11,<7"

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "${{ env.PYINSTALLER_SPEC }}"

      - name: Tests
        run: python -m pytest -q -m "not slow"

      - name: Build standalone executable
        run: python scripts/build_release.py

      - name: Verify frozen bundle
        shell: pwsh
        run: |
          # The GUI binary is a Windows-subsystem executable: PowerShell will not
          # wait for it, so start it explicitly and inspect the exit code.
          $process = Start-Process -FilePath .\dist\JianYin.exe -ArgumentList '--self-check' -PassThru
          if (-not $process.WaitForExit(180000)) {
            Stop-Process -Id $process.Id -Force
            throw 'self-check timed out'
          }
          if ($process.ExitCode -ne 0) { throw "self-check failed with exit code $($process.ExitCode)" }
          Write-Host 'frozen bundle self-check passed'

      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v', '' } else { '0.0.0-dev' }
          "JIANYIN_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Compress-Archive -Path dist/JianYin.exe -DestinationPath "JianYin-$version-windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            JianYin-*-windows-x64.zip
            dist/JianYin.exe

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      # The python.org builds shipped by setup-python do not reliably include
      # _tkinter on macOS, so use Homebrew Python plus the python-tk formula.
      - name: Install Python with Tk
        run: |
          # `brew link` can fail when the runner image already ships python@3.12;
          # the absolute keg path below is used, so a link conflict is harmless.
          brew install python@3.12 python-tk@3.12 || true
          "$(brew --prefix python@3.12)/bin/python3.12" -c "import tkinter; print('tk', tkinter.TkVersion)"

      - name: Create virtualenv
        run: |
          BREW_PY="$(brew --prefix python@3.12)/bin/python3.12"
          "$BREW_PY" -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install -e ".[dev]" "${{ env.PYINSTALLER_SPEC }}"

      - name: Tests
        run: .venv/bin/python -m pytest -q -m "not slow"

      - name: Build standalone app
        run: .venv/bin/python scripts/build_release.py

      - name: Verify frozen bundle
        run: |
          "dist/JianYin.app/Contents/MacOS/JianYin" --self-check

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="0.0.0-dev"
          echo "JIANYIN_VERSION=$VERSION" >> "$GITHUB_ENV"
          ditto -c -k --sequesterRsrc --keepParent "dist/JianYin.app" "JianYin-$VERSION-macos-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          if-no-files-found: error
          path: JianYin-*-macos-${{ matrix.arch }}.zip

  release:
    name: Publish release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          append_body: true
          body: |
            ## 瀹夎璇存槑

            **Windows**锛氳В鍘?`JianYin-*-windows-x64.zip`锛屽弻鍑?`JianYin.exe` 杩愯锛堟棤闇€瀹夎 Python锛夈€?
            **macOS**锛氳В鍘嬪悗鎶?`JianYin.app` 鎷栬繘銆屽簲鐢ㄧ▼搴忋€嶃€傛湰娆℃瀯寤烘病鏈?Apple 寮€鍙戣€呯鍚嶏紝棣栨鎵撳紑闇€鍙抽敭 鈫掋€屾墦寮€銆嶏紝
            鎴栧湪缁堢鎵ц `xattr -cr /Applications/JianYin.app` 瑙ｉ櫎闅旂銆?
            **棣栨浣跨敤**锛氱▼搴忎細鑷姩浠?Hugging Face 涓嬭浇绾?945 MB 鐨?Q4 ONNX 妯″瀷鍒扮敤鎴锋暟鎹洰褰曪紱
            涔熷彲浠ヨ缃幆澧冨彉閲?`JIANYIN_MODEL_DIR` 鎸囧悜宸叉湁鐨勫畬鏁存ā鍨嬬洰褰曪紝瀹炵幇瀹屽叏绂荤嚎杩愯銆?
            鏍￠獙涓嬭浇鏂囦欢锛歚sha256sum -c SHA256SUMS.txt`锛圵indows 鐢?`Get-FileHash` 瀵圭収锛夈€?