name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v0.2.0"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  PYINSTALLER_SPEC: "pyinstaller>=6.11,<7"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows:
    name: Windows x64 (installer + portable, model + OCR)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,download]" "${{ env.PYINSTALLER_SPEC }}"

      - name: Tests
        run: python -m pytest -q -m "not slow"

      - name: Build standalone executable
        run: python scripts/build_release.py

      - name: Verify frozen executable (including bundled OCR)
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\JianYin.exe -ArgumentList '--self-check' -PassThru
          if (-not $process.WaitForExit(240000)) {
            Stop-Process -Id $process.Id -Force
            throw 'self-check timed out'
          }
          if ($process.ExitCode -ne 0) { throw "self-check failed with exit code $($process.ExitCode)" }

      - name: Download Q4 model
        run: python -m jianyin_app.cli download-model --model-dir models/openai-privacy-filter-q4

      - name: Package portable ZIP with model
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          "JIANYIN_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python scripts/package_portable_with_model.py `
            --exe dist/JianYin.exe `
            --model-dir models/openai-privacy-filter-q4 `
            --output "JianYin-$version-windows-x64-with-model.zip" `
            --version $version

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer with model
        shell: pwsh
        run: |
          python scripts/package_windows_installer.py `
            --exe dist/JianYin.exe `
            --model-dir models/openai-privacy-filter-q4 `
            --output "JianYin-$env:JIANYIN_VERSION-windows-x64-setup-with-model.exe" `
            --version $env:JIANYIN_VERSION

      - name: Verify installer installs and runs
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "JianYinInstall"
          $setup = "JianYin-$env:JIANYIN_VERSION-windows-x64-setup-with-model.exe"
          $install = Start-Process -FilePath $setup `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir" `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "installer failed: $($install.ExitCode)" }
          $check = Start-Process -FilePath (Join-Path $installDir "JianYin.exe") `
            -ArgumentList '--self-check' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "installed app self-check failed: $($check.ExitCode)" }
          $uninstall = Join-Path $installDir "unins000.exe"
          if (Test-Path $uninstall) {
            Start-Process -FilePath $uninstall -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          }

      - name: Write checksums
        shell: pwsh
        run: |
          $version = $env:JIANYIN_VERSION
          $names = @(
            "JianYin-$version-windows-x64-with-model.zip",
            "JianYin-$version-windows-x64-setup-with-model.exe"
          )
          $lines = foreach ($name in $names) {
            $hash = (Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLower()
            "$hash  $name"
          }
          $lines | Out-File -FilePath "SHA256SUMS-with-model-windows-$version.txt" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: windows-with-model
          if-no-files-found: error
          path: |
            JianYin-*-windows-x64-with-model.zip
            JianYin-*-windows-x64-setup-with-model.exe
            SHA256SUMS-with-model-windows-*.txt

  macos:
    name: macOS ${{ matrix.arch }} (DMG, model + OCR)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install Python with Tk
        run: |
          brew install python@3.12 python-tk@3.12 || true
          "$(brew --prefix python@3.12)/bin/python3.12" -c "import tkinter; print('tk', tkinter.TkVersion)"

      - name: Create virtualenv
        run: |
          BREW_PY="$(brew --prefix python@3.12)/bin/python3.12"
          "$BREW_PY" -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install -e ".[dev,download]" "${{ env.PYINSTALLER_SPEC }}"

      - name: Tests
        run: .venv/bin/python -m pytest -q -m "not slow"

      - name: Build standalone app
        run: .venv/bin/python scripts/build_release.py

      - name: Verify frozen app (including bundled OCR)
        run: |
          "dist/JianYin.app/Contents/MacOS/JianYin" --self-check

      - name: Download Q4 model
        run: |
          .venv/bin/python -m jianyin_app.cli download-model --model-dir models/openai-privacy-filter-q4

      - name: Build DMG with model
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          ARCH="${{ matrix.arch }}"
          .venv/bin/python scripts/package_macos_dmg.py \
            --app "dist/JianYin.app" \
            --model-dir "models/openai-privacy-filter-q4" \
            --output "JianYin-$VERSION-macos-$ARCH-with-model.dmg" \
            --version "$VERSION" \
            --arch "$ARCH"
          shasum -a 256 "JianYin-$VERSION-macos-$ARCH-with-model.dmg" \
            > "SHA256SUMS-with-model-macos-$ARCH-$VERSION.txt"

      - name: Verify app inside the DMG
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          DMG="JianYin-$VERSION-macos-${{ matrix.arch }}-with-model.dmg"
          MOUNT="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT
          "$MOUNT/JianYin.app/Contents/MacOS/JianYin" --self-check

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-with-model
          if-no-files-found: error
          path: |
            JianYin-*-macos-${{ matrix.arch }}-with-model.dmg
            SHA256SUMS-with-model-macos-${{ matrix.arch }}-*.txt

  release:
    name: Publish release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate combined checksums
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          cd dist
          rm -f SHA256SUMS-with-model-*.txt
          find . -maxdepth 1 -type f ! -name "SHA256SUMS-with-model-$VERSION.txt" -print0 \
            | sort -z | xargs -0 sha256sum > "SHA256SUMS-with-model-$VERSION.txt"
          cat "SHA256SUMS-with-model-$VERSION.txt"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 笺隐 ${{ env.RELEASE_TAG }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          append_body: true
          body: |
            ## 下载

            | 平台 | 安装包 | 便携包 |
            | --- | --- | --- |
            | Windows x64 | `JianYin-*-windows-x64-setup-with-model.exe` | `JianYin-*-windows-x64-with-model.zip` |
            | macOS Apple Silicon | `JianYin-*-macos-arm64-with-model.dmg` | 拖拽安装 |
            | macOS Intel | `JianYin-*-macos-x64-with-model.dmg` | 拖拽安装 |

            每个包都已经包含 OpenAI Privacy Filter Q4 模型和内置 OCR 引擎
            （pdf-to-markdown / PP-OCRv6 small），不需要安装 Python，也不需要联网下载模型。
            扫描 PDF 可以直接导入识别。

            Windows 安装包为当前用户安装（无需管理员权限），也可以使用便携 ZIP 解压后双击
            `启动笺隐.cmd`。

            macOS DMG 打开后把 `JianYin.app` 拖进「应用程序」。构建没有 Apple 开发者签名，
            首次打开请右键 →「打开」，或执行 `xattr -cr /Applications/JianYin.app`。

            校验：`sha256sum -c SHA256SUMS-with-model-*.txt`（Windows 用 `Get-FileHash` 对照）。
            第三方组件许可见包内 `THIRD_PARTY_NOTICES.md` 和 `third_party_licenses/`。
