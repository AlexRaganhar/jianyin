name: macOS with-model bundle

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  package:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install Python with Tk
        run: |
          brew install python@3.12 python-tk@3.12 || true
          "$(brew --prefix python@3.12)/bin/python3.12" -c "import tkinter; print('tk', tkinter.TkVersion)"

      - name: Create virtualenv
        run: |
          BREW_PY="$(brew --prefix python@3.12)/bin/python3.12"
          "$BREW_PY" -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install -e ".[dev]" "pyinstaller>=6.11,<7"

      - name: Tests
        run: .venv/bin/python -m pytest -q -m "not slow"

      - name: Build standalone app
        run: .venv/bin/python scripts/build_release.py

      - name: Verify frozen app
        run: |
          "dist/JianYin.app/Contents/MacOS/JianYin" --self-check

      - name: Download Q4 model
        run: |
          .venv/bin/python -m jianyin_app.cli download-model --model-dir models/openai-privacy-filter-q4

      - name: Package app with model
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          ARCH="${{ matrix.arch }}"
          STAGE="JianYin-$VERSION-macos-$ARCH-with-model"
          ZIP="$STAGE.zip"

          rm -rf "$STAGE" "$ZIP"
          mkdir -p "$STAGE"
          ditto "dist/JianYin.app" "$STAGE/JianYin.app"

          MODEL_DIR="$STAGE/JianYin.app/Contents/MacOS/models/openai-privacy-filter-q4"
          mkdir -p "$MODEL_DIR/onnx"
          for FILE in config.json tokenizer.json viterbi_calibration.json; do
            cp "models/openai-privacy-filter-q4/$FILE" "$MODEL_DIR/$FILE"
          done
          cp "models/openai-privacy-filter-q4/onnx/model_q4.onnx" "$MODEL_DIR/onnx/model_q4.onnx"
          cp "models/openai-privacy-filter-q4/onnx/model_q4.onnx_data" "$MODEL_DIR/onnx/model_q4.onnx_data"

          cp docs/MACOS_WITH_MODEL.md "$STAGE/使用说明-含模型版.md"
          cp LICENSE NOTICE README.md "$STAGE/"

          cat > "$MODEL_DIR/MODEL_NOTICE.txt" <<'EOF'
OpenAI Privacy Filter

Source: https://huggingface.co/openai/privacy-filter
Repository: openai/privacy-filter
Revision: 7ffa9a043d54d1be65afb281eddf0ffbe629385b
License: Apache License 2.0

Bundled with JianYin for offline macOS use. The model is an aid, not an
anonymization or compliance guarantee. Manual review is required.
EOF

          (
            cd "$MODEL_DIR"
            shasum -a 256 config.json tokenizer.json viterbi_calibration.json \
              onnx/model_q4.onnx onnx/model_q4.onnx_data > SHA256SUMS.txt
          )

          ditto -c -k --sequesterRsrc --keepParent "$STAGE" "$ZIP"
          HASH=$(shasum -a 256 "$ZIP" | awk '{print $1}')
          echo "$HASH  $ZIP" > "SHA256SUMS-with-model-macos-$ARCH-$VERSION.txt"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          ARCH="${{ matrix.arch }}"
          gh release upload "${{ inputs.tag }}" \
            "JianYin-$VERSION-macos-$ARCH-with-model.zip" \
            "SHA256SUMS-with-model-macos-$ARCH-$VERSION.txt" \
            --clobber
