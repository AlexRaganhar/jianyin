name: Windows with-model bundle

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "pyinstaller>=6.11,<7"

      - name: Tests
        run: python -m pytest -q -m "not slow"

      - name: Build standalone executable
        run: python scripts/build_release.py

      - name: Verify frozen executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\JianYin.exe -ArgumentList '--self-check' -PassThru
          if (-not $process.WaitForExit(180000)) {
            Stop-Process -Id $process.Id -Force
            throw 'self-check timed out'
          }
          if ($process.ExitCode -ne 0) { throw "self-check failed with exit code $($process.ExitCode)" }

      - name: Download Q4 model
        run: |
          python -m jianyin_app.cli download-model --model-dir models/openai-privacy-filter-q4

      - name: Package executable and model
        shell: pwsh
        run: |
          $version = "${{ inputs.tag }}" -replace '^v', ''
          python scripts/package_portable_with_model.py `
            --exe dist/JianYin.exe `
            --model-dir models/openai-privacy-filter-q4 `
            --output "JianYin-$version-windows-x64-with-model.zip" `
            --version $version
          $hash = (Get-FileHash -LiteralPath "JianYin-$version-windows-x64-with-model.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  JianYin-$version-windows-x64-with-model.zip" |
            Out-File -FilePath "SHA256SUMS-with-model-$version.txt" -Encoding ascii

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ inputs.tag }}" -replace '^v', ''
          gh release upload "${{ inputs.tag }}" `
            "JianYin-$version-windows-x64-with-model.zip" `
            "SHA256SUMS-with-model-$version.txt" `
            --clobber
